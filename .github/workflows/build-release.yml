name: Build and Release SkillSprint Academy

on:
  push:
    tags:
      - 'v*.*.*'   # only runs when you push a tag like v1.0.0, v1.2.3, etc.

permissions:
  contents: write   # required so the workflow can create a Release

jobs:
  build-windows-exe:
    runs-on: windows-latest   # PyInstaller must build the .exe on a real Windows runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Extract version number from the git tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Write VERSION file so the built app knows its own version
        shell: bash
        run: echo "${{ steps.get_version.outputs.VERSION }}" > VERSION

      - name: Build the executable with PyInstaller
        run: pyinstaller build_exe.spec

      - name: Zip the build output
        shell: powershell
        run: |
          Compress-Archive -Path dist\SkillSprintAcademy\* `
            -DestinationPath SkillSprintAcademy-${{ steps.get_version.outputs.VERSION }}-windows.zip

      - name: Create GitHub Release with the zip attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SkillSprint Academy v${{ steps.get_version.outputs.VERSION }}
          body: |
            Automated build for ${{ github.ref_name }}.
            Download the zip below, extract it, and run SkillSprintAcademy.exe.
          files: |
            SkillSprintAcademy-${{ steps.get_version.outputs.VERSION }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}