{% extends "base_cybersec.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 text-danger">500</h1>
            <h2 class="mb-3">Internal Server Error</h2>
            <p class="text-muted mb-4">Something went wrong on our end. The error has been logged.</p>
            <a href="{{ url_for('dashboard.today') }}" class="btn btn-primary">
                <i class="bi bi-house-door me-2"></i>Return to Dashboard
            </a>
            <button class="btn btn-outline-secondary ms-2" id="reloadBtn">
                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('reloadBtn')?.addEventListener('click', () => location.reload());
});
</script>
{% endblock %}
