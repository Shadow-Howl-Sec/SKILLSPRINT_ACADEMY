<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error | SkillSprint Academy</title>
  <link rel="icon" href="/static/img/skill_logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="error-page">
  <div style="position:absolute;inset:0;background:
    radial-gradient(ellipse 50% 60% at 80% 30%, rgba(239,68,68,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 20% 70%, rgba(99,102,241,.3) 0%, transparent 60%);"></div>
  <div style="position:relative;z-index:1;text-align:center;padding:2rem;">
    <a href="/" style="display:inline-flex;align-items:center;gap:.5rem;margin-bottom:3rem;text-decoration:none;">
      <img src="/static/img/skill_logo.png" alt="SkillSprint Academy" width="36">
      <span style="font-family:'Outfit',sans-serif;font-weight:800;color:#fff;font-size:1.1rem;">SkillSprint Academy</span>
    </a>
    <div class="error-code" style="background:linear-gradient(135deg,#ef4444 0%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">500</div>
    <h1 class="error-title">Something Went Wrong</h1>
    <p class="error-subtitle">Our server encountered an unexpected error. Our team has been notified and is working to fix it.</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="/" class="btn-hero-primary"><i class="bi bi-house"></i> Go Home</a>
      <a href="/contact" class="btn-hero-outline"><i class="bi bi-headset"></i> Contact Support</a>
    </div>
  </div>
</div>
</body>
</html>
