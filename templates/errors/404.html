<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | SkillSprint Academy</title>
  <link rel="icon" href="/static/img/skill_logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="error-page">
  <div style="position:absolute;inset:0;background:

    radial-gradient(ellipse 40% 50% at 80% 70%, rgba(245,158,11,.15) 0%, transparent 60%);"></div>
  <div style="position:relative;z-index:1;text-align:center;padding:2rem;">
    <a href="/" style="display:inline-flex;align-items:center;gap:.5rem;margin-bottom:3rem;text-decoration:none;">
      <img src="/static/img/skill_logo.png" alt="SkillSprint Academy" width="36">
      <span style="font-family:'Outfit',sans-serif;font-weight:800;color:#fff;font-size:1.1rem;">SkillSprint Academy</span>
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-subtitle">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="/" class="btn-hero-primary"><i class="bi bi-house"></i> Go Home</a>
      <a href="/courses" class="btn-hero-outline"><i class="bi bi-book"></i> Browse Courses</a>
    </div>
  </div>
</div>

</html>
