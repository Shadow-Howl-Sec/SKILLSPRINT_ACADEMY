<!-- pcap_challenge.html - PCAP Challenge Exercise -->
<div class="mb-3">
    <label class="form-label">PCAP Analysis</label>
    <div class="alert alert-info small">
        <i class="bi bi-info-circle me-1"></i>
        Load a PCAP file from the bundled lab artifacts or analyze the provided capture.
        {% if exerciseSpec.pcap_file %}
        <a href="{{ url_for('labs.serve_bundle_file', lab_id=exercise.lab_id, filename=exerciseSpec.pcap_file) }}" class="btn btn-sm btn-outline-primary ms-2" download>
            <i class="bi bi-download me-1"></i>Download {{ exerciseSpec.pcap_file }}
        </a>
        {% endif %}
    </div>
</div>

<div class="row g-3 mb-3">
    <div class="col-md-6">
        <label class="form-label">Packet Filter (Wireshark syntax)</label>
        <input type="text" id="pcap-filter" class="form-control form-control-sm font-monospace" 
               placeholder="tcp.port == 80 || dns" value="{{ exerciseSpec.filter or '' }}">
    </div>
    <div class="col-md-6">
        <label class="form-label">Analysis Focus</label>
        <select id="pcap-focus" class="form-select form-select-sm">
            <option value="overview">Protocol Overview</option>
            <option value="http">HTTP Traffic</option>
            <option value="dns">DNS Queries</option>
            <option value="tcp">TCP Conversations</option>
            <option value="suspicious">Suspicious Patterns</option>
            <option value="custom">{{ exerciseSpec.focus or 'Custom' }}</option>
        </select>
    </div>
</div>

<div class="d-flex gap-2 mb-3">
    <button class="btn btn-outline-primary btn-sm" onclick="analyzePcap()">
        <i class="bi bi-search me-1"></i>Analyze
    </button>
    <button class="btn btn-outline-secondary btn-sm" onclick="exportFindings()">
        <i class="bi bi-file-earmark-text me-1"></i>Export Findings
    </button>
</div>

<div class="card" id="pcapResults" style="display: none;">
    <div class="card-header bg-dark text-white"><i class="bi bi-terminal me-1"></i>Analysis Results</div>
    <div class="card-body p-0">
        <pre id="pcapOutput" class="mb-0 p-3 bg-dark text-light" style="max-height: 400px; overflow: auto;"></pre>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header bg-light"><i class="bi bi-pencil me-1"></i>Your Findings</div>
    <div class="card-body">
        <textarea id="pcap-findings" class="form-control font-monospace" rows="8" 
                  placeholder="Document your findings here...">{{ exerciseSpec.findings_template or '' }}</textarea>
    </div>
</div>

<script>
function analyzePcap() {
    const filter = document.getElementById('pcap-filter').value;
    const focus = document.getElementById('pcap-focus').value;
    const output = document.getElementById('pcapOutput');
    const panel = document.getElementById('pcapResults');
    
    panel.style.display = 'block';
    output.textContent = 'Loading PCAP... (Note: Full PCAP parsing requires Python/tshark)\n\n';
    
    // Simulated analysis output for demo
    const analyses = {
        overview: `PCAP OVERVIEW
==================
File: ${exerciseSpec.pcap_file || 'challenge.pcap'}
Packets: ~1,234
Duration: 45.2 seconds
Protocols: Ethernet, IPv4, TCP, UDP, DNS, HTTP, TLS

TOP TALKERS:
1. 192.168.56.5 (Kali) → 192.168.56.10 (DC)  : 456 packets
2. 192.168.56.10 (DC) → 192.168.56.5 (Kali)  : 432 packets
3. 192.168.56.5 (Kali) → 8.8.8.8 (DNS)       : 78 packets

CONVERSATIONS:
- TCP 192.168.56.5:49234 ↔ 192.168.56.10:88 (Kerberos)
- TCP 192.168.56.5:49235 ↔ 192.168.56.10:445 (SMB)
- UDP 192.168.56.5:5353 ↔ 192.168.56.10:53 (DNS)
`,
        http: `HTTP TRAFFIC ANALYSIS
=====================
Total HTTP requests: 23
Methods: GET (18), POST (5)

SUSPICIOUS REQUESTS:
1. GET /dvwa/vulnerabilities/sqli/?id=1' UNION SELECT null,username,password FROM users--
   → SQL Injection attempt (DVWA)
   
2. POST /login.php
   Body: username=admin&password=' OR 1=1--
   → Authentication bypass attempt

RESPONSE CODES:
200 OK: 15 | 302 Found: 3 | 403 Forbidden: 2 | 500 Error: 3
`,
        dns: `DNS QUERY ANALYSIS
===================
Total queries: 78
Unique domains: 12

QUERY TYPES:
A (IPv4): 45 | AAAA (IPv6): 12 | PTR: 8 | MX: 5 | TXT: 8

INTERESTING QUERIES:
- purplelab.local (A) → 192.168.56.10 (DC)
- _kerberos._tcp.purplelab.local (SRV) → DC
- _ldap._tcp.dc._msdcs.purplelab.local (SRV) → DC
- suspicious-domain.xyz (A) → NXDOMAIN (possible C2)
`,
        tcp: `TCP CONVERSATION ANALYSIS
=========================
Total TCP streams: 8

STREAM 1: 192.168.56.5:49234 → 192.168.56.10:88 (Kerberos)
  Packets: 12 | Bytes: 8,432 | Duration: 2.1s
  Flags: SYN, SYN-ACK, ACK, PSH-ACK, FIN-ACK
  → AS-REQ/AS-REP exchange (TGT request)

STREAM 2: 192.168.56.5:49235 → 192.168.56.10:445 (SMB)
  Packets: 45 | Bytes: 23,102 | Duration: 12.4s
  → SMB session setup, tree connect, file operations

RETRANSMISSIONS: 3 (0.2%) — Normal
OUT-OF-ORDER: 1 — Normal
`,
        suspicious: `SUSPICIOUS PATTERN DETECTION
============================
⚠️  PORT SCAN DETECTED
   Source: 192.168.56.5 (Kali)
   Target: 192.168.56.10 (DC)
   Ports: 21,22,23,25,53,80,88,135,139,445,3389,5985
   Pattern: SYN scan (nmap -sS)
   Time: 00:00:12 - 00:00:18

⚠️  KERBEROASTING INDICATORS
   Event ID 4769 (TGS-REQ) with RC4-HMAC (0x17)
   SPNs requested: HTTP/web01, MSSQLSvc/sql01
   Source: 192.168.56.5 (Kali)
   
⚠️  SMB RELAY ATTEMPT
   NTLMSSP_AUTH from Kali → DC
   Target: 192.168.56.10:445
   Challenge captured, relayed to LDAP
`,
        custom: `CUSTOM ANALYSIS: ${filter || 'No filter applied'}

This would run tshark/pyshark with your filter:
  tshark -r challenge.pcap -Y "${filter}"

For full analysis, use Wireshark or the Python exercise environment.
`
    };
    
    output.textContent = analyses[focus] || analyses.overview;
}

function exportFindings() {
    const findings = document.getElementById('pcap-findings').value;
    const blob = new Blob([findings], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pcap-findings.md';
    a.click();
    URL.revokeObjectURL(url);
}
</script>
