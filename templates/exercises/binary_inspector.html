<!-- binary_inspector.html - Binary Inspector Exercise -->
<div class="mb-3">
    <label class="form-label">Binary Analysis</label>
    <div class="alert alert-info small">
        <i class="bi bi-info-circle me-1"></i>
        Analyze a binary file from the bundled lab artifacts.
        {% if exerciseSpec.binary_file %}
        <a href="{{ url_for('labs.serve_bundle_file', lab_id=exercise.lab_id, filename=exerciseSpec.binary_file) }}" class="btn btn-sm btn-outline-primary ms-2" download>
            <i class="bi bi-download me-1"></i>Download {{ exerciseSpec.binary_file }}
        </a>
        {% endif %}
    </div>
</div>

<div class="row g-3 mb-3">
    <div class="col-md-4">
        <label class="form-label">Analysis Tool</label>
        <select id="bin-tool" class="form-select form-select-sm">
            <option value="strings">Strings</option>
            <option value="hexdump">Hex Dump</option>
            <option value="headers">PE/ELF Headers</option>
            <option value="imports">Imports/Exports</option>
            <option value="sections">Sections</option>
            <option value="entropy">Entropy</option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Offset (hex)</label>
        <input type="text" id="bin-offset" class="form-control form-control-sm font-monospace" placeholder="0x0" value="0x0">
    </div>
    <div class="col-md-4">
        <label class="form-label">Length (hex)</label>
        <input type="text" id="bin-length" class="form-control form-control-sm font-monospace" placeholder="0x100" value="0x200">
    </div>
</div>

<div class="d-flex gap-2 mb-3">
    <button class="btn btn-outline-primary btn-sm" id="inspectBinaryBtn">
        <i class="bi bi-search me-1"></i>Inspect
    </button>
    <button class="btn btn-outline-secondary btn-sm" id="exportBinaryBtn">
        <i class="bi bi-download me-1"></i>Export Output
    </button>
</div>

<div class="card" id="binaryResults" style="display: none;">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span><i class="bi bi-terminal me-1"></i>Output</span>
        <span id="binaryToolLabel" class="badge bg-secondary"></span>
    </div>
    <div class="card-body p-0">
        <pre id="binaryOutput" class="mb-0 p-3 bg-dark text-light" style="max-height: 500px; overflow: auto; font-size: 0.85rem;"></pre>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header bg-light"><i class="bi bi-pencil me-1"></i>Your Analysis</div>
    <div class="card-body">
        <textarea id="binary-analysis" class="form-control font-monospace" rows="8" 
                  placeholder="Document your findings: suspicious strings, imports, packer detection, etc...">{{ exerciseSpec.analysis_template or '' }}</textarea>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('inspectBinaryBtn')?.addEventListener('click', inspectBinary);
  document.getElementById('exportBinaryBtn')?.addEventListener('click', exportBinary);
});

function inspectBinary() {
    const tool = document.getElementById('bin-tool').value;
    const offset = document.getElementById('bin-offset').value;
    const length = document.getElementById('bin-length').value;
    const output = document.getElementById('binaryOutput');
    const panel = document.getElementById('binaryResults');
    const label = document.getElementById('binaryToolLabel');
    
    panel.style.display = 'block';
    label.textContent = tool.toUpperCase();
    
    let result = sampleBinary[tool] || 'Tool not implemented in demo.\n\nIn production, this would:\n1. Fetch the binary from bundled artifacts\n2. Parse with lief/pefile/capstone\n3. Return actual analysis';
    
    if (tool === 'hexdump') {
        result += `\n\n[Offset: ${offset}, Length: ${length}]`;
    }
    
    output.textContent = result;
}

function exportBinary() {
    const output = document.getElementById('binaryOutput').textContent;
    const tool = document.getElementById('bin-tool').value;
    const blob = new Blob([output], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `binary_${tool}_analysis.txt`;
    a.click();
    URL.revokeObjectURL(url);
}
