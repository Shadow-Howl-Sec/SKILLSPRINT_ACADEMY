{# cipher_lab: interactive Caesar / Vigenere widget #}
<div class="mb-2 small text-muted">{{ spec.prompt|default("Try encrypting and decrypting using the cipher.") }}</div>
<div class="row g-2 mb-2">
  <div class="col-sm-9">
    <input id="ss_text" class="form-control" placeholder="plaintext or ciphertext" value="{{ spec.starter|default('HELLO') }}">
  </div>
  <div class="col-sm-3">
    <input id="ss_key" class="form-control" placeholder="key (ROT13 / number / word)" value="{{ spec.key|default('13') }}">
  </div>
</div>
<div class="btn-group mb-3">
  <button class="btn btn-outline-primary" id="ss_enc">Encrypt</button>
  <button class="btn btn-outline-primary" id="ss_dec">Decrypt</button>
</div>
<pre class="bg-dark text-light p-3 rounded small" id="ss_out">(result)</pre>

<script>
const SPEC = {{ spec_json|safe }};

function rot(s, k) {
  k = ((k % 26) + 26) % 26;
  return s.split("").map((c) => {
    const code = c.charCodeAt(0);
    if (code >= 65 && code <= 90)  return String.fromCharCode((code - 65 + k) % 26 + 65);
    if (code >= 97 && code <= 122) return String.fromCharCode((code - 97 + k) % 26 + 97);
    return c;
  }).join("");
}
function vigenere(s, key, decrypt) {
  const sign = decrypt ? -1 : 1;
  key = key.toUpperCase().replace(/[^A-Z]/g, "");
  let ki = 0;
  return s.split("").map((c) => {
    const code = c.charCodeAt(0);
    const isUpper = code >= 65 && code <= 90;
    const isLower = code >= 97 && code <= 122;
    if (!isUpper && !isLower) return c;
    const base = isUpper ? 65 : 97;
    const k = (key.charCodeAt(ki % key.length) - 65) * sign;
    ki++;
    return String.fromCharCode(((code - base + k + 26) % 26) + base);
  }).join("");
}

const $ = (s) => document.querySelector(s);
function compute(decrypt) {
  const txt = $("#ss_text").value;
  const key = $("#ss_key").value;
  if (/^\d+$/.test(key)) {
    $("#ss_out").textContent = rot(txt, parseInt(key, 10) * (decrypt ? -1 : 1));
  } else {
    $("#ss_out").textContent = vigenere(txt, key, !!decrypt);
  }
}
$("#ss_enc").addEventListener("click", () => compute(false));
$("#ss_dec").addEventListener("click", () => compute(true));
if (SPEC.expected) {
  // If the spec pins an expected ciphertext, mark pass/fail after each compute.
  document.getElementById("ss_enc").click();
}
</script>
