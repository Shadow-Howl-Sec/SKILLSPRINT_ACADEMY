{# quiz_interactive: branching-scenario quiz — outcome depends on choices #}
<div class="mb-3 small text-muted">{{ spec.prompt }}</div>
<div id="ss_scene"></div>
<div class="mt-3">
  <button class="btn btn-outline-secondary btn-sm" id="ss_restart"><i class="bi bi-arrow-counterclockwise"></i> Restart</button>
</div>

<script>
const SPEC = {{ spec_json|safe }};
const START = SPEC.start_scene || (SPEC.scenes && SPEC.scenes[0] && SPEC.scenes[0].id);
let history = [];

function renderScene(id) {
  const sc = (SPEC.scenes || []).find((s) => s.id === id);
  if (!sc) { return; }
  if (sc.outcome) {
    document.getElementById("ss_scene").innerHTML =
      "<div class='alert alert-" + (sc.outcome === "pass" ? "success" : "danger") + "'>" +
      "<strong>" + (sc.outcome === "pass" ? "Pass" : "Try again") + "</strong><br>" +
      sc.text + "</div>";
    return;
  }
  document.getElementById("ss_scene").innerHTML =
    "<div class='card bg-light mb-2'><div class='card-body'>" + sc.text + "</div></div>" +
    (sc.choices || []).map((c, i) =>
      "<button class='btn btn-outline-primary btn-sm me-2 ss-choice' data-next='" + c.next + "'>" +
      c.label + "</button>").join("");
  document.querySelectorAll(".ss-choice").forEach((b) => {
    b.addEventListener("click", () => { history.push({from: id, to: b.dataset.next}); renderScene(b.dataset.next); });
  });
}

document.getElementById("ss_restart").addEventListener("click", () => { history = []; renderScene(START); });
renderScene(START);
</script>
