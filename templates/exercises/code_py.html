{# code_py: write Python in textarea, run in Pyodide, validate with unit_tests #}
<div class="mb-3">
  <label class="form-label small fw-semibold">{{ spec.prompt }}</label>
  <textarea id="ss_code" class="form-control font-monospace"
            rows="10" spellcheck="false"
            placeholder="print('Hello, SkillSprint!')">{{ spec.starter|default('') }}</textarea>
</div>

<div class="d-flex gap-2 mb-3">
  <button class="btn btn-primary" id="ss_run"><i class="bi bi-play-fill"></i> Run</button>
  <button class="btn btn-success" id="ss_check"><i class="bi bi-check2-circle"></i> Submit & grade</button>
</div>

<pre class="bg-dark text-light p-3 rounded small" id="ss_output"
     style="min-height:6rem;max-height:18rem;overflow:auto;">(output appears here)</pre>

<script>
const SPEC = {{ spec_json|safe }};
const $ = (s) => document.querySelector(s);
$("pre#ss_output").textContent = "(awaiting run...)";
function setOut(s) { $("pre#ss_output").textContent = s; }

$("#ss_run").addEventListener("click", () => {
  setOut("...running...");
  window.SkillSprintExercise.runPython($("#ss_code").value).then((r) => {
    setOut(r.stdout + (r.stderr ? "\n-- stderr --\n" + r.stderr : ""));
  }).catch((e) => setOut("Pyodide unavailable. Vendored under static/vendor/pyodide/ - " +
                          "see static/vendor/pyodide/README.md.\nError: " + e));
});

$("#ss_check").addEventListener("click", () => {
  setOut("...grading...");
  window.SkillSprintExercise.gradeCodePy(SPEC, $("#ss_code").value).then((r) => {
    let s = (r.passed ? "[PASS]\n" : "[FAIL]\n") + r.stdout;
    if (r.results) {
      r.results.forEach((t) => { s += "\n  " + (t.passed ? "ok " : "X ") + t.name; });
    }
    if (r.stderr) { s += "\n-- stderr --\n" + r.stderr; }
    setOut(s);
  }).catch((e) => setOut("Pyodide unavailable: " + e));
});
</script>
